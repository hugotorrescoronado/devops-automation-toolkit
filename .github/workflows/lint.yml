name: Python Lint

on:
  push:
  pull_request:

jobs:

  lint:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      - name: Install Linter

        run: |

          pip install flake8

      - name: Run Flake8

        run: |

          flake8 python --max-line-length=120